services:
  redis:
    image: redis:7-alpine
    container_name: akf-redis
    ports:
      - "6379:6379"

  api:
    build: ./packages/api
    container_name: akf-api
    env_file:
      - ./.env
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=file:./dev.db
      - API_PORT=${API_PORT}
      - STORAGE_ROOT=/app/storage
      - MAX_THREADS=${MAX_THREADS}
    volumes:
      - ./storage:/app/storage
      - ./prisma:/app/prisma
    ports:
      - "${API_PORT}:4000"
    depends_on:
      - redis

  worker:
    build: ./packages/worker
    container_name: akf-worker
    env_file:
      - ./.env
    environment:
      - REDIS_URL=${REDIS_URL}
      - DATABASE_URL=file:./dev.db
      - STORAGE_ROOT=/app/storage
      - MAX_THREADS=${MAX_THREADS}
      - NATIVE_SSH_HOST=${NATIVE_SSH_HOST}
      - NATIVE_SSH_USER=${NATIVE_SSH_USER}
      - NATIVE_SSH_KEY_PATH=${NATIVE_SSH_KEY_PATH}
    volumes:
      - ./storage:/app/storage
      - ./prisma:/app/prisma
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - api

  web:
    build: ./packages/web
    container_name: akf-web
    env_file:
      - ./.env
    environment:
      - VITE_API_URL=http://localhost:${API_PORT}
      - WEB_PORT=${WEB_PORT}
    ports:
      - "${WEB_PORT}:3000"
    depends_on:
      - api

networks:
  default:
    name: akf-net