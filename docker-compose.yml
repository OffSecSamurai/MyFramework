version: '3.8'

services:
  # Redis for job queue
  redis:
    image: redis:7-alpine
    container_name: akshays-framework-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Backend
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: akshays-framework-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/database.sqlite
      - REDIS_URL=redis://redis:6379
      - PORT=3001
      - STORAGE_PATH=/app/storage
      - LOG_LEVEL=info
    volumes:
      - api_storage:/app/storage
      - api_database:/app/prisma
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Frontend
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: akshays-framework-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Worker Service
  worker:
    build:
      context: ./packages/worker
      dockerfile: Dockerfile
    container_name: akshays-framework-worker
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/database.sqlite
      - REDIS_URL=redis://redis:6379
      - STORAGE_PATH=/app/storage
      - LOG_LEVEL=info
      - WORKER_CONCURRENCY=5
      - EXECUTION_MODE=docker
    volumes:
      - worker_storage:/app/storage
      - api_database:/app/prisma
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 2

  # Tools Service (contains all security tools)
  tools:
    build:
      context: ./packages/worker
      dockerfile: Dockerfile.tools
    container_name: akshays-framework-tools
    environment:
      - NODE_ENV=production
    volumes:
      - tools_storage:/app/tools
    restart: unless-stopped

volumes:
  redis_data:
  api_storage:
  worker_storage:
  api_database:
  tools_storage:

networks:
  default:
    name: akshays-framework-network